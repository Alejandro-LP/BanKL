<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración — BanKL</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-page">
<header class="site-header">
    <div>
        <a class="brand" href="index.html" aria-label="BanKL, inicio"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 3 35 11.5v17L20 37 5 28.5v-17L20 3Z"/><path d="M14 27V13h4v5l5-5h5l-6 6 6 8h-5l-4-5-1 1v4h-4Z"/></svg></span><span class="brand-word">Ban<b>KL</b></span></a>
        <small>Panel Administrador</small>
    </div>
    <div class="buttons">
        <button onclick="cerrarSesion()">Salir</button>
        <button onclick="toggleDark()" class="dark-btn">Modo Oscuro</button>
    </div>
</header>

<section class="admin-intro"><div><span class="inicio-eyebrow">BANCO · ADMINISTRACIÓN</span><h1>Clientes</h1><p>Consulta y actualiza la información de tus clientes.</p></div><div class="admin-total"><strong id="totalClientes">—</strong><span>clientes registrados</span></div></section>
<div class="admin-tools"><label class="admin-search"><span>⌕</span><input id="buscarCliente" type="search" placeholder="Buscar por nombre, usuario o correo" autocomplete="off"></label><span class="admin-search-hint">Información de clientes naturales</span></div>

<main class="admin-grid" id="listaClientes">
    <p class="empty">Cargando clientes...</p>
</main>

<!-- Modal edicion -->
<div class="modal-overlay" id="modalEditar">
    <div class="modal">
        <h3>Editar cliente</h3>
        <input type="hidden" id="editIdDB">
        <div class="modal-field">
            <label>NOMBRES</label>
            <input type="text" id="editNombres">
        </div>
        <div class="modal-field">
            <label>APELLIDOS</label>
            <input type="text" id="editApellidos">
        </div>
        <div class="modal-field">
            <label>EMAIL</label>
            <input type="email" id="editEmail">
        </div>
        <div class="modal-field">
            <label>TELEFONO</label>
            <input type="text" id="editTelefono">
        </div>
        <div class="modal-field">
            <label>DIRECCION</label>
            <input type="text" id="editDireccion">
        </div>
        <div id="msgExito" class="msg-exito">Cambios guardados correctamente</div>
        <div class="modal-btns">
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-guardar" onclick="guardarCambios()">Guardar cambios</button>
        </div>
    </div>
</div>

<footer><div>BanKL</div></footer>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
