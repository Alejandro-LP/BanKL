
# Conexión a la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankl?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=15m

# Enable temporarily in Render to create the README demo administrator.
bankl.admin.seed.enabled=${ADMIN_SEED_ENABLED:false}

# Cash-advance charges are demo defaults; override with bank-approved pricing in each deployment.
bankl.avance.comision-porcentaje=${BANKL_AVANCE_COMISION_PORCENTAJE:0.03}
bankl.avance.comision-minima=${BANKL_AVANCE_COMISION_MINIMA:5000.00}
bankl.avance.tasa-mensual=${BANKL_AVANCE_TASA_MENSUAL:0.02}
